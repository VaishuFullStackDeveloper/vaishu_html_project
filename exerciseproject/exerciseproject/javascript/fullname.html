<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capitalize Full Name</title>
</head>

<body>

    <label for="fullname">Enter Full Name:</label>
    <input type="text" id="fullname" />
    <button onclick="newName()">Convert</button>
    <h3>Formatted Name:</h3>
    <p id="output"></p>

    <script>
      
        function getFullName() {
            return document.getElementById("fullname").value;  
        }

        
        function newName() {
            const fullName = getFullName(); 
            const newFullName = fullName.split(' '); 

           
            const capitalizedWords = newFullName.map(word => 
                word.charAt(0).toUpperCase() + word.slice(1).toLowerCase()
            );

            const result = capitalizedWords.join(' ');  
            document.getElementById("output").textContent = result;  
        }
    </script>

</body>

</html>
