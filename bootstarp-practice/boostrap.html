

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Layout class 1</title>
    <!-- Bootstrap css cdn link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <style>
        /* row-one css */
        .row-one {
            height: 100px;
        }

        .one {
            background-color: rgb(225, 138, 94);
        }

        .two {
            background-color: rgb(199, 106, 120);
        }

        .three {
            background-color: rgb(45, 108, 105);
        }
        .Home{
            background-color: brown;
            height: 300px;
            margin: 0px;
        }
        .About{
            background-color: rgb(242, 173, 173);
            height: 400px;

        }
        .Contact{
            background-color: rgb(185, 215, 102);
            height: 400px;
        }
        .Project{
            background-color: rgb(200, 170, 213);
            height: 400px;
        }
        
    </style>
</head>

<body>
    <!-- Container-fluid division -->
    <div class="container-fluid">
        <!-- row division -->
        <div class="row row-one">
            <!-- column division in row -->
            <div class="one col-sm-12 col-md-12 col-lg-3 col-xl-4 col-xxl-6"><h3><a href="#Home"> Home</a></h3></div>
            <div class="two col-sm-6  col-md-12 col-lg-3 col-xl-4 col-xxl-3"><h3><a href="#About">About</a></h3></div>
            <div class="three col-sm-6  col-md-12 col-lg-6 col-xl-4 col-xxl-3"><h3><a href="#Project"> Project</a></h3></div>

</div>

<div class="Home col-sm-12" id="Home">Home</div>
<div class="About col-sm-12" id="About">About</div>
<div class="Project col-sm-12" id="Project">Project</div>
<div class="Contact col-sm-12">Contact</div>


    </div>
</body>

</html>
