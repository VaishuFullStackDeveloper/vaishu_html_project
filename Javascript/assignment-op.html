<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Marks Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background-color: #ffffff;
      padding: 20px;
      border-radius: 12px;
    
      width: 90%;
      max-width: 400px;
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
      color: #333;
    }

    p {
      font-size:20px;
      margin-bottom: 10px;
      color: #555;
    }

    #totalDisplay {
      margin-top: 20px;
      font-weight: bold;
      color: #007BFF;
      font-size: 1.2rem;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 1rem;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      
    }

    button:hover {
      background-color: #218838;
    }

    
  </style>
</head>
<body>
    <div class="container">
      <h1>Student Marks Calculator</h1>
      <p>Math Marks: 40</p>
      <p>Science Marks: 35</p>
      <button onclick="result()">Show Result</button>
      <p id="totalDisplay">Show the total marks</p>
    </div>
  
    <script>
      let mathMarks = 40;
      let scienceMarks = 35;
  
      function result() {
        let total = mathMarks + scienceMarks;
        alert(total); 
        document.getElementById("totalDisplay").innerHTML = "Total Marks: " + total;
      }
    </script>
  </body>
  
</html>
