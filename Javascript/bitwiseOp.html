<!DOCTYPE html>
<html>
<head>
    <title>Even Checker</title>
</head>
<body>
    <h3>Even Number Checker</h3>
    <p>(Using Bitwise AND Operator)</p>
    <input type="number" id="num" placeholder="Enter a number">
    <br>
    <br>

    <button onclick="check()">Check</button>
    <p id="result"></p>

    <script>
        function check() {
            let num = Number(prompt("Enter a number:"));
            let  = document.getElementById("num").value;
            if ((num & 1) === 0) {
                document.getElementById("result").text = num + " is Even";
            } else {
                document.getElementById("result").text = num + " is Odd";
            }
        }
        
    </script>
</body>
</html>
