    function clearfunc() {
        document.getElementById('result').innerHTML = "";

function equalstoo() {
        const display = document.getElementById('result');
        try {
            display.innerText = eval(display.innerText);
        } catch {
            display.innerText = 'Error';
        }
    }
    function deletfuc() {
        const display = document.getElementById('result');
        if (display.innerText.length === 1 || display.innerText === 'Error') {
            display.innerText = '0';
        } else {
            display.innerText = display.innerText.slice(0, -1);
        }
    }

<style>

    table {
        background-color: gray;
        height: 50vh;
        width: 35vw;

        </tr>
        <!-- third row input -->

            <td><button onclick="numbertype(6)">6</button></td>
            <td ><button style="background-color:rgb(198, 132, 142);" onclick="numbertype('-')"><p>-</p></button></td>
        </tr>
        <!-- fifth row input -->
        <tr class="five">
            <td><button onclick="numbertype(7)">7</button></td>
            <td><button onclick="numbertype(8)">8</button></td>
            <td><button onclick="numbertype(9)">9</button></td>
            <td><button style="background-color: rgb(198, 132, 142);" onclick="numbertype('+')"><p>+</p></button></td>
        </tr>
        <!-- sixth row input -->
        <tr class="six">
            <td ><button onclick="numbertype(0)">0</button></td>
            <td><button onclick="dotfun()"><p>.</p></button></td>
            <td colspan="2"><button style="background-color: rgb(198, 132, 142);" onclick="equalstoo('=')"><p>=</p></button></td>
        </tr>
