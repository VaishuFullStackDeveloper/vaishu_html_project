<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>page</title>
    <style>
        /* main-container-styling */
        .container {
            width: 40vw;
            height: 60vh;
            background-color: #6A9AB0;
            margin-left: 30%;
            margin-top: 10%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: double;

    }
    /* first-box-styling */
    .first-box {
            width: 90%;
            height: 30%;
            border: solid;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #243642;
        
        
        }
        input{
            width:90% ;
            height:70% ;
            background-color: white;
        }
        #display {
            text-align: center;
            font-size: 25px;
        }
/* second-box-styling */
        .second-box {
            width: 90%;
            height: 60%;
            border: solid;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #F4F6FF;
        }
        /* button-styling */
        button{
        width: 40%;
        height:20%;
        background-color: green;
        font-size: 120%;
        display: flex;
        flex-direction:column;
        align-items: center;
        justify-content:center;
        }
    </style>
</head>

<body>
    <!-- main-container -->
    <div class="container">
        <!-- first-container -->
        <div class="first-box">
        <input type="text" id="display" placeholder="display">
        </div>
         <!-- second-container -->
        <div class="second-box">
        <button type="button">Start</button>
        <button type="button">End</button>
        </div>
    </div>

    
   

</body>

</html>
