<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood-donate</title>
    <style>
        /* main-container-styling */
        .main-container {
            background-color: white;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
        }

        .container {
            height: 60vh;
            width: 30vw;
            background-color: rgb(213, 212, 226);
            text-align: center;
            padding: 5%;
            margin-top: 50px;
            border: double;
           background-position: center;
       background-size: cover;
        }

        input {
            width: 90%;
            height: 10%;
            padding: 10px;
            border-radius: 10px;
            font-size: 20px;
        }

        button {
            background-color: rgb(239, 72, 30);
            width: 90%;
            height: 10%;
            padding: 10px;
            border-radius: 10px;
            font-size: 20px;
        }

        .display {
            width: 30vw;
            height: 10vh;
            border: solid 1px;
            background-color: white;

        }
    </style>
</head>
<!-- script section -->
<script>

    function compare() {
        let x = Number(document.getElementById("first-number").value)
        let y = Number(document.getElementById("second-number").value)

        if (x >= 18 && y > 45) {
            document.getElementById("demo").innerHTML = 'You are eligible';
        }
        else {
            document.getElementById("demo").innerHTML = 'You are not eligible';
        }
    }

</script>

<body>
    <!-- main-container -->
    <div class="main-container">
        <div class="container">
            <div class="display">
                <h1 id="demo">Blood-Donation</h1>
            </div>
            <br>
            <br>
            <!-- first input -->
            <input type="number" id="first-number" placeholder="Enter Age">
            <br />
            <br />
            <!-- second input -->
            <input type="number" id="second-number" placeholder="Enter Weight">
            <br />
            <br />
            <!-- Button -->
            <button type="button" onclick="compare()">Compare</button>
        </div>
    </div>


</body>

</html>
