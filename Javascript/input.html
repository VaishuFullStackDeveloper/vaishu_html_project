<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Responsive Counter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background:white;
      color:black;
    }

    .main-container {
      background:lightslategray;
        
      border-radius: 12px;
      text-align: center;
      
      width: 40%;
      height: 400px;
    }

    #Result {
      font-size: 50px;
      margin-bottom: 20%;
      width: 90%;
      height: 30%;
      background-color:rgb(202, 219, 230);
      margin-left: 30px;
    }

    button {
      background-color:rgb(152, 240, 152);
      color: #764ba2;
      border: none;
    width:20% ;
    height: 10%;
      font-size: 20px;
      border-radius: 8px;
      cursor: pointer;
  
    }

    button:hover {
      background-color: #e0e0e0;
    }

    
    
  </style>
</head>
<body>
    <div class="main-container">
      <div id="Result">0</div>
      <button onclick="addNumber()">Add Number</button>
      <button onclick="minusNumber()">Sub Number</button>
    </div>
  
    <script>
      let number = 0;
      document.getElementById("Result").innerHTML = number;
  
      function addNumber() {
        let coin = Number(prompt("Enter a number"));
        number = number + coin;
        document.getElementById("Result").innerHTML = number;
        // Removed: document.getElementById("add-coin").innerHTML = coin;
      }
  
      function minusNumber() {
        let subtract = Number(prompt("Enter a number"));
        number = number - subtract;
        document.getElementById("Result").innerHTML = number;
        // Removed: document.getElementById("substact-coin").innerHTML = subtract;
      }
    </script>
  </body>
  
</html>
