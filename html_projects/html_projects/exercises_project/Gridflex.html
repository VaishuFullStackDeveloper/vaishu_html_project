
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main-container {
            
            height: 100vh;
            width: 100vw;
            display: grid;
            background-color: lightslategray;


        }

        .first-row {

            width: 80%;
            height: 15vh;
            background-color: rgb(227, 113, 203);
        }

        .second-row {
            display: flex;
            width: 80%;
            height: 55vh;
            background-color: white;
        }

        .first-box {
            background-color: rgb(124, 106, 243);
            align-items: flex-start;
            

            }

        .second-box {
            background-color: rgb(119, 222, 117);
            align-items: flex-end;
        }

        .third-row {

            height: 15vh;
            background-color: rgb(208, 120, 88);
        }

        .fourth-row {
            display: grid;
            height: 15vh;
            background-color: rgb(104, 112, 80);
        }
    </style>
</head>

<body>
    <div class="main-container">
        <div class="first-row"></div>
        <div class="second-row">
            <div class="first-box"></div>
            <div class="second-box"></div>
        </div>
        <div class="third-row"></div>
        <div class="fourth-row"></div>
    </div>
</body>

</html>
