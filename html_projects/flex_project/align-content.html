<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Align</title>

</head>
<style>
    body{
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
    }
    .main-container{
        width: 100%;
        height: 100%;
        background-color: rgb(188, 239, 241);
        display: flex;
        flex-direction: row;
        gap: 20px;
        flex-wrap: wrap;
        align-content: flex-end;
    }
    .box-1{
        width: 20%;
        height: 20%;
        background-color: brown;
    }
    .box-2{
        width: 20%;
        height: 20%;
        background-color: rgb(173, 221, 162);
    }
    .box-3{
        width: 20%;
        height: 20%;
        background-color: rgb(208, 136, 188);
    }

    
</style>
<body>
    <div class="main-container">
        <div class="box-1"></div>
        <div class="box-2"></div>
        <div class="box-3"></div>
    </div>
</body>
</html>
