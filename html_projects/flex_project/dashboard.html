<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
body{
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
    }
.main-container{
    width: 80vw;
    height: 80vh;
    background-color: lightskyblue;
    border-radius: 30px;
    margin-left: 10%;
    border: solid black;
    margin-top: 5%;

}
.header{
    width: 100%;
    height: 10%;
    background-color:rgb(245, 247, 201);
    text-align: center;
    
}
.display{
    width: 100%;
    height: 50%;
    background-color: lightslategray;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 20px;
}
.one{
width: 20%;
height: 60%;
background-color: lightpink;
border: solid black;

}
.two{
width: 20%;
height: 60%;
background-color: lightpink;
border: solid black;


}
.three{
width: 20%;
height: 60%;
background-color:lightpink;
border: solid black;


}
.four{
width: 20%;
height: 60%;
background-color: lightpink;
border: solid black;

}
.icon{
    font-size: 50px;
    width: 10%;
    height: 10%;
    margin-left: 20px;
    margin-top: 20px;
}
.box-title{
    font-size: 20px;
    margin-left: 20px;
    margin-top: 20px;

}
.value{
    font-size: 30px;
    margin-left: 20px;
    margin-top: 20px;
    font-weight: 700;
}

</style>
<body>
    <div class="main-container">
        <div class="header">
            <h1>Dashdoard Overview</h1>
        </div>
        <div class="display">
            <div class="one">
                <span class="icon">📊</span>
              <div class="box-title">Total Reveue</div>
              <div class="value">12,000</div>
            </div>
            <div class="two">
                <span class="icon">🙋🏻‍♂️</span>
                <div class="box-title"> New Users</div>
                <div class="value">150</div>
            </div>
            <div class="three">
                <span class="icon">💰</span>
                <div class="box-title">Order</div>
                <div class="value">200</div>
            </div>
            <div class="four">
                <span class="icon">⭐</span>
                <div class="box-title"> Satisfact</div>
                <div class="value">5,000</div>
                
            </div>
        </div>
    </div>
</body>
</html>
